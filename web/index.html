<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FundaHub — funding discovery for young African entrepreneurs.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FundaHub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FundaHub</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Chrome on some networks resets connections to gstatic.com.
    Remap FlutterFire's Firebase JS imports to local copies under /firebasejs.
  -->
  <script type="importmap">
  {
    "imports": {
      "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js": "./firebasejs/firebase-app.js",
      "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js": "./firebasejs/firebase-auth.js",
      "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js": "./firebasejs/firebase-firestore.js",
      "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-pipelines.js": "./firebasejs/firebase-firestore-pipelines.js",
      "https://www.gstatic.com/firebasejs/12.15.0/firebase-storage.js": "./firebasejs/firebase-storage.js"
    }
  }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('cdn-proxy-sw.js').catch(function (err) {
        console.warn('CDN proxy SW registration failed', err);
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
